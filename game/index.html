<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c9defa" />
  <meta name="description" content="Play Contact with friends." />
  <title>Contact</title>
  <link rel="stylesheet" href="/game/stage-v3.css" />
</head>
<body data-phase="landing">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/game" aria-label="Contact home">CONTACT</a>
      <div class="connection" id="connectionStatus"><i></i><span>Connecting</span></div>
    </header>
    <main>
      <section id="landingView" class="landing">
        <div class="join-panel panel">
          <h1>Join the game</h1>
          <label for="nameInput">Your name</label>
          <input id="nameInput" maxlength="24" autocomplete="nickname" placeholder="Name" />
          <fieldset class="avatar-fieldset"><legend>Your avatar</legend><div id="avatarPicker" class="avatar-picker"></div></fieldset>
          <button id="createBtn" class="button red big" type="button">Create Room</button>
          <div class="or">or join a room</div>
          <form id="joinForm" class="join-row"><label class="sr-only" for="roomInput">Room code</label><input id="roomInput" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ROOM CODE" /><button class="button blue" type="submit">Join</button></form>
          <p class="micro">3–10 players</p>
        </div>
      </section>
      <section id="roomView" class="room-view hidden">
        <div class="room-head"><div class="room-code-pod"><span>Room Code</span><div><h2 id="roomCode">------</h2><button id="copyInviteBtn" type="button" aria-label="Copy invite link" title="Copy invite link">▢</button></div></div><div id="headerClock"></div></div>
        <button id="leaveBtn" class="text-button leave" type="button">Leave</button>
        <div class="game-grid">
          <aside class="panel players-panel"><div class="panel-title"><h2>Players</h2><span id="playerCount">0 / 10</span></div><div id="playerList" class="player-list"></div></aside>
          <section class="game-main"><div id="lobbyCard"></div><div id="gameCard" class="hidden"></div></section>
          <aside class="right-rail"><div id="sideTools"></div><section class="panel activity-panel"><h3>Recent activity</h3><div id="activityList" class="activity-list"></div></section></aside>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/game/stage-v3.js"></script>
</body>
</html>
