<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rammerhead</title><link rel="stylesheet" href="/browser.css"></head><body><form id="navigate"><span class="mark">↗</span><label for="address" class="sr-only">Website address</label><input id="address" placeholder="Enter a website, e.g. example.com" autocomplete="off" spellcheck="false" required><button id="go">Go →</button><button type="button" id="reload" title="Reload the current page">↻</button><button type="button" id="new-session">New session</button></form><p id="status" role="status">Your browsing session is ready. Enter a website to begin.</p><div id="welcome"><span>OPEN A NEW PERSPECTIVE</span><h1>Where to?</h1><p>Your own Rammerhead session.<br>Enter a web address above to get started.</p><small>Sessions expire after inactivity. Some websites may not work through a proxy.</small><a href="https://github.com/binary-person/rammerhead" target="_blank" rel="noreferrer">Powered by Rammerhead ↗</a></div><iframe id="page" title="Proxied website" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads" referrerpolicy="no-referrer" hidden></iframe><script src="/browser.js" defer></script></body></html>
