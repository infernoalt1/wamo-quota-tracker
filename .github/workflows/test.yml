name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun test --coverage

      - name: Check coverage threshold
        run: |
          # Run coverage and capture output
          OUTPUT=$(bun test --coverage 2>&1)
          echo "$OUTPUT"

          # Extract line coverage percentage (look for "All files" line)
          COVERAGE=$(echo "$OUTPUT" | grep -E "All files" | awk '{print $4}' | tr -d '%')

          if [ -z "$COVERAGE" ]; then
            echo "Could not parse coverage. Checking if tests passed..."
            echo "$OUTPUT" | grep -q "pass" && exit 0 || exit 1
          fi

          THRESHOLD=50
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${THRESHOLD}%"

          if [ $(echo "$COVERAGE < $THRESHOLD" | bc -l) -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

          echo "Coverage check passed!"
