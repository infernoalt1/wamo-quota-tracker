<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>WAMO Quota Tracker - Math Contest Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
      :root {
        --bg-grid-color: rgba(0, 0, 0, 0.04);
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F8F9FA; /* Architectural Light Gray */
        color: #1e293b; /* Slate 800 */
        /* Technical Grid Pattern */
        background-image: 
          linear-gradient(var(--bg-grid-color) 1px, transparent 1px), 
          linear-gradient(90deg, var(--bg-grid-color) 1px, transparent 1px);
        background-size: 24px 24px; /* Tighter grid */
        -webkit-font-smoothing: antialiased;
      }
      /* Custom Scrollbar for Light Mode - Thinner, sleeker */
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* KaTeX override */
      .katex {
        color: inherit !important;
        font-size: 1.0em !important;
      }
      
      /* Utility for glass panels */
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
    </style>
